<h1>Directivas</h1>

<h2 style="color: blueviolet">
    Tienes {{deportes.length}} deportes
</h2>

@if (deportes.length > 5){
    <p>Tienes mas de 5 deportes</p>
} @else {
<p>Tienes menos de 5 deportes</p>
}
<select>
    @for (sport of deportes; track sport) {
        <option>{{sport}}</option>
    }
</select>

<ul>
    @for (sport of deportes; track sport) {
        <li>{{sport}}</li>
    }
</ul>

@for (sport of deportes; track sport) {
    <p>{{sport}}</p>

}
